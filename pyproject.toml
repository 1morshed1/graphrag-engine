[project]
name = "graphrag-engine"
version = "0.1.0"
description = "Knowledge-graph-enhanced retrieval (GraphRAG) that runs offline out of the box."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "1morshed1" }]
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
]

[project.optional-dependencies]
# Real embedding models (local, no API key needed).
embeddings = ["sentence-transformers>=2.2"]
# Better community detection (Leiden algorithm).
leiden = ["python-igraph>=0.11", "leidenalg>=0.10"]
# Hosted LLM providers.
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
# Everything for development.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[project.scripts]
graphrag = "graphrag_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
